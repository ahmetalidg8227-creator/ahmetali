<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Fütüristik Oyuncu Sayacı - Uzay Modu</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           CSS TASARIM VE ANİMASYONLAR
           ========================================= */
        :root {
            --p1-color: #ff2a6d; /* Neon Pembe */
            --p2-color: #05d9e8; /* Neon Mavi */
            --p3-color: #01ffc3; /* Neon Yeşil */
            --p4-color: #f1c40f; /* Neon Sarı */
            --bg-color: #0b0c10;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
        }

        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: var(--bg-color);
            /* Arka plan Ay görseli ve siber ızgara eklendi */
            background-image: 
                linear-gradient(rgba(5, 217, 232, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(5, 217, 232, 0.05) 1px, transparent 1px),
                url('https://images.unsplash.com/photo-1522030299830-16b8d3d049fe?auto=format&fit=crop&w=1920&q=80');
            background-size: 30px 30px, 30px 30px, cover;
            background-position: center, center, center;
            background-attachment: fixed;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }

        /* Giriş ve Sonuç Panelleri */
        #setup, #results {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(11, 12, 16, 0.75);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(5, 217, 232, 0.3);
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 50px rgba(5, 217, 232, 0.15);
            width: 90%;
            max-width: 450px;
        }

        #setup h2, #winner-title {
            margin-bottom: 25px;
            font-size: 2.2rem;
            letter-spacing: 3px;
            color: var(--p2-color);
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--p2-color);
        }

        #winner-title {
            color: var(--p3-color);
            text-shadow: 0 0 20px var(--p3-color);
            animation: pulse 1.5s infinite;
        }

        .input-group {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .input-group input {
            width: 48%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--p2-color);
            box-shadow: 0 0 10px rgba(5, 217, 232, 0.3);
        }

        .setup-time {
            width: 100% !important;
            text-align: center;
            font-size: 1.5rem !important;
            margin-top: 10px;
        }

        button.start-btn, button.restart-btn {
            margin-top: 25px;
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 2px solid var(--p3-color);
            color: var(--p3-color);
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button.start-btn:hover, button.restart-btn:hover {
            background: var(--p3-color);
            color: #000;
            box-shadow: 0 0 20px var(--p3-color);
        }

        /* 4'lü Izgara Oyun Alanı */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            width: 100vw;
            height: 100vh;
            gap: 6px; 
            /* Arka plan resminin görünmesi için siyahlık şeffaflaştırıldı */
            background: rgba(0, 0, 0, 0.4); 
        }

        .player-box {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Cam efekti (Glassmorphism) eklendi */
            background: rgba(11, 12, 16, 0.4);
            backdrop-filter: blur(8px);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.4s ease;
            opacity: 0.25;
            filter: grayscale(90%);
        }

        .fill-bg {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            transition: height 0.1s linear;
        }

        #p1 .fill-bg { background: linear-gradient(to top, rgba(255, 42, 109, 0.35), transparent); }
        #p2 .fill-bg { background: linear-gradient(to top, rgba(5, 217, 232, 0.35), transparent); }
        #p3 .fill-bg { background: linear-gradient(to top, rgba(1, 255, 195, 0.35), transparent); }
        #p4 .fill-bg { background: linear-gradient(to top, rgba(241, 196, 15, 0.35), transparent); }

        /* Elenme Karartma Katmanı */
        .status-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0);
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 5px;
            color: #ff0055;
            text-shadow: 0 0 15px #ff0055;
            transition: background 0.5s;
            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .name { 
            font-size: 2.2rem; 
            letter-spacing: 3px; 
            margin-bottom: 10px; 
            text-transform: uppercase;
        }

        .timer { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 6.5rem; 
            transition: color 0.3s;
        }

        /* Aktif Durum */
        .player-box.active {
            opacity: 1;
            filter: grayscale(0%);
            z-index: 5;
            background: rgba(11, 12, 16, 0.7); /* Aktifken biraz daha koyulaşsın ki yazı okunsun */
        }

        #p1.active { box-shadow: inset 0 0 60px rgba(255, 42, 109, 0.5); border: 2px solid var(--p1-color); }
        #p2.active { box-shadow: inset 0 0 60px rgba(5, 217, 232, 0.5); border: 2px solid var(--p2-color); }
        #p3.active { box-shadow: inset 0 0 60px rgba(1, 255, 195, 0.5); border: 2px solid var(--p3-color); }
        #p4.active { box-shadow: inset 0 0 60px rgba(241, 196, 15, 0.5); border: 2px solid var(--p4-color); }

        #p1.active .timer { color: var(--p1-color); text-shadow: 0 0 25px var(--p1-color); }
        #p2.active .timer { color: var(--p2-color); text-shadow: 0 0 25px var(--p2-color); }
        #p3.active .timer { color: var(--p3-color); text-shadow: 0 0 25px var(--p3-color); }
        #p4.active .timer { color: var(--p4-color); text-shadow: 0 0 25px var(--p4-color); }

        /* Elenmiş Durum */
        .player-box.eliminated {
            opacity: 0.15 !important;
            filter: grayscale(100%) blur(2px) !important;
            cursor: not-allowed;
        }
        .player-box.eliminated .status-overlay {
            background: rgba(11, 12, 16, 0.85);
        }

        /* Son 10 Saniye Animasyonu */
        @keyframes alert-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); color: #ff0033; text-shadow: 0 0 30px #ff0033; }
        }
        .warning .timer {
            animation: alert-pulse 0.8s infinite;
        }

        /* Sıralama Tablosu Satırları */
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #fff;
            font-size: 1.3rem;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .leaderboard-item.rank-1 { border-color: var(--p3-color); color: var(--p3-color); font-weight: bold; background: rgba(1, 255, 195, 0.1); }
        .leaderboard-item.rank-2 { border-color: var(--p2-color); }
        .leaderboard-item.rank-3 { border-color: var(--p4-color); }
        .leaderboard-item.rank-4 { border-color: var(--p1-color); opacity: 0.6; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div id="setup">
        <h2>Sistem Başlatılıyor</h2>
        
        <div class="input-group">
            <input type="text" id="name1" placeholder="1. Oyuncu" value="Oyuncu 1">
            <input type="text" id="name2" placeholder="2. Oyuncu" value="Oyuncu 2">
        </div>
        <div class="input-group">
            <input type="text" id="name3" placeholder="3. Oyuncu" value="Oyuncu 3">
            <input type="text" id="name4" placeholder="4. Oyuncu" value="Oyuncu 4">
        </div>
        
        <input type="number" id="duration" class="setup-time" placeholder="Dakika (Örn: 5)" value="5" min="1">
        
        <button class="start-btn" onclick="startApp()">Sistemi Başlat</button>
    </div>

    <div id="results" style="display: none;">
        <h1 id="winner-title">KAZANDINIZ!</h1>
        <div id="leaderboard-list">
            </div>
        <button class="restart-btn" onclick="location.reload()">Yeni Oyun Başlat</button>
    </div>

    <div class="container" style="display: none;" id="game-board">
        <div id="p1" class="player-box" onclick="nextTurn(1)">
            <div class="fill-bg" id="fill1"></div>
            <div class="status-overlay" id="status1"></div>
            <div class="content">
                <div class="name" id="label1">Oyuncu 1</div>
                <div class="timer" id="time1">00:00</div>
            </div>
        </div>
        <div id="p2" class="player-box" onclick="nextTurn(2)">
            <div class="fill-bg" id="fill2"></div>
            <div class="status-overlay" id="status2"></div>
            <div class="content">
                <div class="name" id="label2">Oyuncu 2</div>
                <div class="timer" id="time2">00:00</div>
            </div>
        </div>
        <div id="p3" class="player-box" onclick="nextTurn(3)">
            <div class="fill-bg" id="fill3"></div>
            <div class="status-overlay" id="status3"></div>
            <div class="content">
                <div class="name" id="label3">Oyuncu 3</div>
                <div class="timer" id="time3">00:00</div>
            </div>
        </div>
        <div id="p4" class="player-box" onclick="nextTurn(4)">
            <div class="fill-bg" id="fill4"></div>
            <div class="status-overlay" id="status4"></div>
            <div class="content">
                <div class="name" id="label4">Oyuncu 4</div>
                <div class="timer" id="time4">00:00</div>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           JAVASCRIPT OYUN MANTIĞI VE DÖNGÜSÜ
           ========================================= */
        const players = [
            { id: 1, name: "", msLeft: 0, totalMs: 0, isEliminated: false },
            { id: 2, name: "", msLeft: 0, totalMs: 0, isEliminated: false },
            { id: 3, name: "", msLeft: 0, totalMs: 0, isEliminated: false },
            { id: 4, name: "", msLeft: 0, totalMs: 0, isEliminated: false }
        ];

        let activePlayerIndex = null;
        let lastTime = 0;
        let animationFrameId = null;
        let isGameRunning = false;
        let eliminationOrder = [];

        function startApp() {
            const dk = parseFloat(document.getElementById('duration').value);
            if(isNaN(dk) || dk <= 0) return alert("Lütfen geçerli bir süre girin!");

            const totalMs = dk * 60 * 1000;
            eliminationOrder = []; 

            for(let i = 0; i < 4; i++) {
                const nameInput = document.getElementById(`name${i+1}`).value || `Oyuncu ${i+1}`;
                players[i].name = nameInput;
                players[i].msLeft = totalMs;
                players[i].totalMs = totalMs;
                players[i].isEliminated = false;
                
                document.getElementById(`label${i+1}`).innerText = nameInput;
                document.getElementById(`status${i+1}`).innerText = "";
                document.getElementById(`p${i+1}`).classList.remove('eliminated', 'active', 'warning');
                updateDisplay(i);
            }

            document.getElementById('setup').style.display = 'none';
            document.getElementById('game-board').style.display = 'grid';

            activePlayerIndex = 0; 
            document.getElementById('p1').classList.add('active');
            isGameRunning = true;
            lastTime = Date.now();
            
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameLoop() {
            if (!isGameRunning) return;

            const now = Date.now();
            const deltaTime = now - lastTime;
            lastTime = now;

            if (activePlayerIndex !== null) {
                let p = players[activePlayerIndex];
                p.msLeft -= deltaTime;

                if (p.msLeft <= 0) {
                    p.msLeft = 0;
                    p.isEliminated = true;
                    updateDisplay(activePlayerIndex);
                    
                    eliminationOrder.push(p);
                    
                    const currentBox = document.getElementById(`p${activePlayerIndex+1}`);
                    currentBox.classList.remove('active', 'warning');
                    currentBox.classList.add('eliminated');
                    document.getElementById(`status${activePlayerIndex+1}`).innerText = "ELENDİ";

                    const survivors = players.filter(pl => !pl.isEliminated);
                    
                    if (survivors.length === 1) {
                        eliminationOrder.push(survivors[0]); 
                        isGameRunning = false;
                        showLeaderboard(survivors[0]);
                        return; 
                    } else {
                        switchToNextAlivePlayer();
                    }
                } else {
                    updateDisplay(activePlayerIndex);
                }
            }

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function updateDisplay(index) {
            const p = players[index];
            const timeElement = document.getElementById(`time${index+1}`);
            const boxElement = document.getElementById(`p${index+1}`);
            const fillElement = document.getElementById(`fill${index+1}`);

            const totalSeconds = Math.ceil(p.msLeft / 1000);
            let m = Math.floor(totalSeconds / 60);
            let s = totalSeconds % 60;
            
            m = m < 10 ? "0" + m : m;
            s = s < 10 ? "0" + s : s;
            
            timeElement.innerText = `${m}:${s}`;

            const percent = (p.msLeft / p.totalMs) * 100;
            fillElement.style.height = `${percent}%`;

            if (totalSeconds <= 10 && totalSeconds > 0 && !p.isEliminated) {
                boxElement.classList.add('warning');
            } else {
                boxElement.classList.remove('warning');
            }
        }

        function nextTurn(clickedPlayerId) {
            if (!isGameRunning) return;

            const clickedIndex = clickedPlayerId - 1;

            if (clickedIndex === activePlayerIndex && !players[clickedIndex].isEliminated) {
                document.getElementById(`p${activePlayerIndex+1}`).classList.remove('active');
                switchToNextAlivePlayer();
            }
        }

        function switchToNextAlivePlayer() {
            let attempts = 0;
            do {
                activePlayerIndex = (activePlayerIndex + 1) % 4;
                attempts++;
            } while (players[activePlayerIndex].isEliminated && attempts < 4);

            if (!players[activePlayerIndex].isEliminated) {
                document.getElementById(`p${activePlayerIndex+1}`).classList.add('active');
                lastTime = Date.now();
            }
        }

        function showLeaderboard(winner) {
            cancelAnimationFrame(animationFrameId);
            document.getElementById('game-board').style.display = 'none';
            
            const resultsDiv = document.getElementById('results');
            const listDiv = document.getElementById('leaderboard-list');
            
            document.getElementById('winner-title').innerText = `🏆 KAZANAN: ${winner.name}`;
            listDiv.innerHTML = ""; 

            const finalRankings = [...eliminationOrder].reverse();

            finalRankings.forEach((player, index) => {
                const rank = index + 1;
                const item = document.createElement('div');
                item.className = `leaderboard-item rank-${rank}`;
                
                let timeInfo = "SÜRE BİTTİ";
                if (rank === 1) {
                    const totalSeconds = Math.ceil(player.msLeft / 1000);
                    let m = Math.floor(totalSeconds / 60);
                    let s = totalSeconds % 60;
                    timeInfo = `KALAN SÜRE: ${m < 10 ? "0" + m : m}:${s < 10 ? "0" + s : s}`;
                }

                item.innerHTML = `<span>#${rank} ${player.name}</span> <span>${timeInfo}</span>`;
                listDiv.appendChild(item);
            });

            resultsDiv.style.display = 'block';
        }
    </script>
</body>
</html>
